<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>ddnet-automap-creator</title>

    <!-- --all-features lets wasm-opt accept what rustc emits, such as bulk memory. -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--all-features" />
    <link data-trunk rel="copy-dir" href="target/rpp" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1b1b;
      }

      canvas {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
      }

      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #b8b8b8;
        font: 16px system-ui, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="loading">Loading…</div>
    <canvas id="app_canvas"></canvas>
  </body>
</html>
